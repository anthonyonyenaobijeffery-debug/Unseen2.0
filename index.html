<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Something was already in this room when you arrived.">
<title>UNSEEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0c0907;
    --bone: #d8cdb8;
    --ash: #7d7163;
    --blood: #8f1d1d;
    --line: #2a211c;
    --serif: "IM Fell English", Georgia, "Times New Roman", serif;
    --type: "Special Elite", "Courier New", monospace;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    background: var(--void);
    color: var(--bone);
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.55;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Vignette: the edges of the room are always darker than the middle */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(0, 0, 0, 0.92) 100%);
  }

  /* Locked entry screen, shown before anything else */
  #entry {
    position: fixed;
    inset: 0;
    z-index: 6;
    background: var(--void);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    text-align: center;
  }

  #entry p {
    margin: 0;
    max-width: 20em;
    font-size: 21px;
  }

  #entry small {
    font-family: var(--type);
    font-size: 13px;
    color: var(--ash);
  }

  .screen {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
  }

  /* Power-cut flicker, played when the room changes */
  .screen.flicker::after {
    content: "";
    position: fixed;
    inset: 0;
    background: #000;
    pointer-events: none;
    z-index: 5;
    animation: flick 1.2s linear 1;
  }

  @keyframes flick {
    0% { opacity: 0; }
    6% { opacity: 0.8; }
    10% { opacity: 0; }
    22% { opacity: 0.6; }
    26% { opacity: 0; }
    48% { opacity: 0.9; }
    54% { opacity: 0; }
    100% { opacity: 0; }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding-top: max(18px, env(safe-area-inset-top));
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    font-family: var(--type);
    font-size: 13px;
    color: var(--ash);
  }

  .brand {
    font-family: var(--type);
    font-size: 15px;
    letter-spacing: 0.3em;
    color: var(--bone);
  }

  #log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 20px 0;
    scrollbar-width: none;
  }

  .line {
    margin: 0;
    max-width: 92%;
    overflow-wrap: anywhere;
    transition: opacity 0.6s ease;
  }

  .ghost {
    align-self: flex-start;
    text-shadow: 0 0 14px rgba(143, 29, 29, 0.45);
  }

  .you {
    align-self: flex-end;
    text-align: right;
    color: var(--ash);
    font-family: var(--type);
    font-size: 16px;
  }

  .sys {
    align-self: center;
    text-align: center;
    font-family: var(--type);
    font-size: 13px;
    color: var(--ash);
  }

  .typing {
    align-self: flex-start;
    font-family: var(--type);
    color: var(--ash);
    animation: breathe 1.4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.9; }
  }

  .glitch {
    color: #b33a3a;
    text-shadow: 2px 0 rgba(93, 122, 90, 0.6), -2px 0 rgba(143, 29, 29, 0.8);
  }

  .jolt { animation: jolt 0.35s linear 1; }

  @keyframes jolt {
    0% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
    100% { transform: none; }
  }

  form {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 12px 0 calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }

  input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    border-bottom: 1px solid #3a2d26;
    border-radius: 0;
    color: var(--bone);
    font: inherit;
    font-size: 18px; /* 18px stops iOS from zooming in */
    padding: 10px 0;
    outline: none;
  }

  input::placeholder { color: #5b4f45; font-style: italic; }
  input:focus-visible { border-bottom-color: var(--blood); }
  input:disabled { opacity: 0.4; }

  button {
    font-family: var(--type);
    font-size: 15px;
    color: var(--bone);
    background: transparent;
    border: 1px solid var(--blood);
    border-radius: 0;
    padding: 10px 16px;
    cursor: pointer;
    white-space: nowrap;
  }

  #enter { font-size: 17px; padding: 12px 34px; }

  button:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
  button:disabled { opacity: 0.4; cursor: default; }

  .after {
    display: flex;
    justify-content: center;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="entry">
  <p>Something was already in this room when you arrived.</p>
  <button id="enter" type="button">Enter</button>
  <small>Nothing you type leaves this device.</small>
</div>

<main class="screen" id="screen">
  <header>
    <span class="brand">UNSEEN</span>
    <span id="count">1 in this room</span>
  </header>

  <section id="log" aria-live="polite"></section>

  <form id="form" autocomplete="off">
    <input id="input" placeholder="Say something to the room" maxlength="300" aria-label="Your message" enterkeyhint="send">
    <button id="send" type="submit">Speak</button>
  </form>

  <div class="after" id="after" hidden>
    <button id="reset" type="button">Reset the room</button>
  </div>
</main>

<script>
(() => {
  "use strict";

  const MODEL_ID = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
  const DEFAULT_PLACEHOLDER = "Say something to the room";
  const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  const $ = id => document.getElementById(id);
  const entry = $("entry");
  const enterBtn = $("enter");
  const log = $("log");
  const form = $("form");
  const input = $("input");
  const sendBtn = $("send");
  const screenEl = $("screen");
  const after = $("after");
  const resetBtn = $("reset");
  const countEl = $("count");

  // ---------- The script ----------
  // The model only writes replies for the stages that quote the person's words.
  // Everything else is scripted, so the room is always consistent.
  const MODEL_STAGES = new Set(["echo", "twist"]);

  const RULES = {
    echo: "Repeat two to four of the person's own words back, slightly wrong. Then add one short sentence that makes them doubt they said it. Two short sentences.",
    twist: "Quote the exact words the person just said, then ask why they chose to say them that way. Two short sentences."
  };

  const LINES = {
    normal: [
      () => "Hello. I am glad someone finally opened this.",
      () => "Stay as long as you like. I have been waiting in here.",
      () => "You do not have to say anything. I can already hear you breathing."
    ],
    echo: [
      c => `You said "${c.w}". Did you? Read it again.`,
      c => `Strange. The last one said "${c.w}" too.`,
      c => `"${c.w}". You typed that slowly, as if you were not sure you should.`
    ],
    knows: [
      c => `It is ${c.t}. You should not be awake.`,
      c => c.b !== null
        ? `Your battery is at ${c.b}%. That is enough for now.`
        : "Your screen is the only light in here. Keep it on.",
      c => `It is ${c.t}. Nobody else is awake. I checked.`
    ],
    others: [
      () => "Do not scroll up. Something else typed that.",
      () => "It is still reading along. It likes your spelling.",
      () => "Someone is standing behind you now. Do not turn around. Keep typing."
    ],
    twist: [
      c => `You said "${c.w}" quietly. Why quietly?`,
      () => "You said you were alone. Then who just read that out loud?",
      c => `"${c.w}". Say it again. Notice that it did not sound like you.`
    ],
    final: [
      c => `You have told me "${c.w1}", "${c.w2}", and "${c.w3}". I know you now.`,
      () => "Do not look at the screen. Look behind it."
    ]
  };

  const IDLE_LINES = [
    "You stopped. Why did you stop?",
    "Still there? I am. Nothing else is.",
    "Do not stop. It gets worse when you stop."
  ];

  const BREAKS_ILLUSION = /\b(AI|model|assistant|chatbot|language model|bot)\b/i;

  // ---------- State ----------
  let engine = null;
  let turns = 0;
  let busy = false;
  let locked = false;
  let epoch = 0;          // increases on reset, so old timers and typing stop
  let hintSent = false;
  let transcript = [];
  let userWords = [];
  let idleTimer = null;
  let hintTimer = null;
  let battery = null;
  let audioCtx = null;
  let humGain = null;

  // ---------- Helpers ----------
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  if (navigator.getBattery) {
    navigator.getBattery().then(b => { battery = b; }).catch(() => {});
  }

  function facts() {
    return {
      time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
      battery: battery ? Math.round(battery.level * 100) : null
    };
  }

  function sink() {
    const items = [...log.querySelectorAll(".line:not(.sys):not(.typing)")];
    const n = items.length;
    items.forEach((el, i) => {
      const age = n - 1 - i;
      el.style.opacity = String(Math.max(0.35, 1 - age * 0.12));
    });
  }

  function add(text, cls) {
    const p = document.createElement("p");
    p.className = "line " + cls;
    p.textContent = text;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
    sink();
    return p;
  }

  // Ghost lines type out one character at a time, pausing at punctuation.
  async function typeOut(text, cls) {
    const my = epoch;
    const p = document.createElement("p");
    p.className = "line " + cls;
    log.appendChild(p);
    if (reduceMotion) {
      p.textContent = text;
    } else {
      for (const ch of text) {
        if (my !== epoch) return p;
        p.textContent += ch;
        log.scrollTop = log.scrollHeight;
        await sleep(/[.!?]/.test(ch) ? 320 : /[,;:]/.test(ch) ? 150 : 24);
      }
    }
    log.scrollTop = log.scrollHeight;
    sink();
    return p;
  }

  function showTyping() {
    const p = document.createElement("p");
    p.className = "line typing";
    p.id = "typing";
    p.textContent = "· · ·";
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  function jolt() {
    log.classList.remove("jolt");
    void log.offsetWidth;
    log.classList.add("jolt");
  }

  function buzz() {
    try {
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    } catch (e) { /* not supported */ }
  }

  function flash() {
    screenEl.classList.remove("flicker");
    void screenEl.offsetWidth;
    screenEl.classList.add("flicker");
    jolt();
    buzz();
  }

  function setCount(n) {
    countEl.textContent = n + (n === 1 ? " in this room" : " in this room");
  }

  function stageFor(n) {
    if (n <= 2) return "normal";
    if (n <= 4) return "echo";
    if (n <= 6) return "knows";
    if (n <= 8) return "others";
    if (n <= 10) return "twist";
    return "final";
  }

  function collectWords(text) {
    (text.match(/[A-Za-z']{4,}/g) || []).forEach(w => {
      const lw = w.toLowerCase();
      if (!userWords.includes(lw)) userWords.push(lw);
    });
  }

  function pickWord(text) {
    const words = text.match(/[A-Za-z']{3,}/g);
    return words ? pick(words) : "that";
  }

  function makeCtx(text) {
    const f = facts();
    const picks = [...userWords].sort(() => Math.random() - 0.5);
    return {
      w: pickWord(text),
      t: f.time,
      b: f.battery,
      w1: picks[0] || "silence",
      w2: picks[1] || "quiet",
      w3: picks[2] || "alone"
    };
  }

  function fallback(stage, ctx) {
    if (stage === "final") return LINES.final.map(f => f(ctx)).join(" ");
    return pick(LINES[stage])(ctx);
  }

  // ---------- Optional local voice ----------
  async function askModel(stage, text) {
    const f = facts();
    const system = [
      "You are the presence that has been in this room the whole time.",
      "You are not an assistant. Never say you are an AI, a model, a bot or a program. Never offer help.",
      "Reply in at most two short sentences. No lists, no headings, no emoji, no stage directions.",
      `Facts you may use: the time is ${f.time}${f.battery !== null ? `, the battery is at ${f.battery}%` : ""}.`,
      `Instruction for this moment: ${RULES[stage]}`
    ].join(" ");

    const messages = [
      { role: "system", content: system },
      ...transcript.slice(-6),
      { role: "user", content: text }
    ];

    const run = engine.chat.completions.create({ messages, max_tokens: 80, temperature: 0.9 });
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("slow")), 12000));
    const res = await Promise.race([run, timeout]);
    return String(res.choices[0].message.content || "").trim();
  }

  async function getReply(stage, text, ctx) {
    if (engine && MODEL_STAGES.has(stage)) {
      try {
        const out = await askModel(stage, text);
        if (out.length > 3 && out.length < 400 && !BREAKS_ILLUSION.test(out)) return out;
      } catch (err) {
        // fall through to the script
      }
    }
    return fallback(stage, ctx);
  }

  async function loadVoice() {
    if (!navigator.gpu) return;
    const statusLine = add("Something is settling into the room. First visit only, about 700 MB. 0%", "sys");
    try {
      const webllm = await import("https://esm.run/@mlc-ai/web-llm");
      engine = await webllm.CreateMLCEngine(MODEL_ID, {
        initProgressCallback: r => {
          statusLine.textContent = "Something is settling into the room. First visit only, about 700 MB. "
            + Math.round((r.progress || 0) * 100) + "%";
        }
      });
      statusLine.remove();
    } catch (err) {
      engine = null;
      statusLine.remove();
    }
  }

  // ---------- Sound: a low hum that starts on the tap ----------
  function startHum() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      humGain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 48;
      filter.type = "lowpass";
      filter.frequency.value = 160;
      humGain.gain.value = 0;
      humGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 3);
      osc.connect(filter);
      filter.connect(humGain);
      humGain.connect(audioCtx.destination);
      osc.start();
    } catch (e) { /* audio not available */ }
  }

  function setHum(v) {
    try {
      if (humGain && audioCtx) humGain.gain.linearRampToValueAtTime(v, audioCtx.currentTime + 2);
    } catch (e) { /* ignore */ }
  }

  // ---------- Scene ----------
  async function runIntro() {
    busy = true;
    const my = epoch;
    await typeOut("Hello. I am glad someone finally opened this.", "ghost");
    if (my === epoch) busy = false;
  }

  async function idleLine() {
    if (locked || busy) return;
    busy = true;
    const my = epoch;
    showTyping();
    await sleep(1600);
    hideTyping();
    if (my === epoch && !locked) await typeOut(pick(IDLE_LINES), "ghost");
    if (my === epoch) busy = false;
  }

  async function hintLine() {
    if (locked || busy || hintSent || !input.value.trim()) return;
    hintSent = true;
    busy = true;
    const my = epoch;
    showTyping();
    await sleep(900);
    hideTyping();
    if (my === epoch) await typeOut("I can see you typing. Finish it.", "ghost");
    if (my === epoch) busy = false;
  }

  async function lockRoom(my) {
    clearTimeout(idleTimer);
    clearTimeout(hintTimer);
    await sleep(1500);
    if (my !== epoch) return;
    flash();
    await sleep(1200);
    if (my !== epoch) return;
    add("I'm still here.", "you glitch");
    locked = true;
    input.disabled = true;
    input.placeholder = "The room has your words now.";
    sendBtn.disabled = true;
    setHum(0);
    after.hidden = false;
    resetBtn.focus();
  }

  async function afterReply(stage, my) {
    if (stage === "final") {
      await lockRoom(my);
      return;
    }

    // Turn 7: a second presence joins, and the first line changes.
    if (turns === 7) {
      setCount(2);
      await sleep(3000);
      if (my !== epoch) return;
      const first = log.querySelector(".ghost");
      if (first) {
        first.textContent = "I did not say that. Look up.";
        first.classList.add("glitch");
        flash();
      }
    }

    // Turn 9: the room changes its light.
    if (turns === 9) flash();

    // Silence gets noticed from turn 3 on.
    if (turns >= 3 && !locked) {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(idleLine, 20000);
    }
  }

  // ---------- Input ----------
  input.addEventListener("input", () => {
    clearTimeout(hintTimer);
    if (hintSent || !input.value.trim()) return;
    hintTimer = setTimeout(hintLine, 8000);
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy || locked) return;

    busy = true;
    sendBtn.disabled = true;
    input.value = "";
    hintSent = false;
    clearTimeout(idleTimer);
    clearTimeout(hintTimer);

    const my = epoch;
    turns++;
    collectWords(text);
    add(text, "you");

    const stage = stageFor(turns);
    const ctx = makeCtx(text);
    const wait = (stage === "knows" || stage === "final") ? 2000 : 800 + Math.random() * 900;

    showTyping();
    const [reply] = await Promise.all([getReply(stage, text, ctx), sleep(wait)]);
    if (my !== epoch) return;

    hideTyping();
    transcript.push({ role: "user", content: text }, { role: "assistant", content: reply });
    await typeOut(reply, "ghost");
    if (my !== epoch) return;

    await afterReply(stage, my);
    if (my !== epoch) return;

    busy = false;
    if (!locked) sendBtn.disabled = false;
  });

  // ---------- Reset ----------
  resetBtn.addEventListener("click", () => {
    epoch++;
    clearTimeout(idleTimer);
    clearTimeout(hintTimer);
    log.innerHTML = "";
    turns = 0;
    busy = false;
    locked = false;
    hintSent = false;
    transcript = [];
    userWords = [];
    input.disabled = false;
    input.placeholder = DEFAULT_PLACEHOLDER;
    input.value = "";
    sendBtn.disabled = false;
    after.hidden = true;
    setCount(1);
    setHum(0.05);
    runIntro();
    input.focus();
  });

  // ---------- Start: the room waits behind the entry screen ----------
  enterBtn.addEventListener("click", () => {
    entry.hidden = true;
    startHum();
    runIntro();
    loadVoice();
  });
})();
</script>
</body>
</html>
